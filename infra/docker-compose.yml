# Local + single-VPS deployment. Supabase is hosted (or `supabase start` locally).
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#   docker compose -f infra/docker-compose.yml --env-file .env --profile premium up -d   # + premium lane
name: inbetween

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      WORKER_ROLE: all
    volumes:
      - worker-data:/data
    ports:
      - "8787:8787"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # ffmpeg-heavy: give it the box. ~5 concurrent streams per 8 vCPU / 16 GB (measure in M1).
    stop_grace_period: 60s

  dashboard:
    build:
      context: ..
      dockerfile: infra/dashboard.Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    env_file: ../.env
    ports:
      - "3000:3000"
    restart: unless-stopped

  premium:
    profiles: ["premium"]
    build:
      context: ..
      dockerfile: infra/premium.Dockerfile
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - worker-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis:
  worker-data:
